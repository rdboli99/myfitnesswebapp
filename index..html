<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ross Fitness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ross Fitness</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#166534;--goodbg:#dcfce7;--blue:#1d4ed8;--bluebg:#dbeafe;--warn:#9a3412;--warnbg:#ffedd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{background:#111827;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;color:#d1d5db;font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:18px;margin-top:3px}
.list button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin-bottom:8px}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tabs button{background:none;color:#6b7280;padding:8px 10px;font-size:12px}
.tabs button.active{color:#111827;font-weight:800}
.exercise{border-top:1px solid var(--line);padding:15px 0}
.exercise:first-child{border-top:0}
.exercise-title{display:flex;justify-content:space-between;gap:10px}
.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;height:max-content}
.badge-deload{background:var(--warnbg);color:var(--warn)}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 45px;gap:7px;align-items:center;margin:7px 0}
.setrow input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px}
.setrow button{padding:8px;font-size:12px}
.recommend{margin-top:10px;padding:10px;border-radius:10px;background:var(--bluebg);color:#1e3a8a;font-size:13px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.bar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:#111827;transition:width 0.3s}
.goalrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.timer-bar{position:fixed;top:0;left:0;right:0;background:#166534;color:#fff;text-align:center;padding:10px;font-weight:bold;z-index:100;display:flex;justify-content:space-between;align-items:center}
.calendar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cal-day{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px}
.cal-day.active{background:#111827;color:#fff}
.cal-day.completed{background:var(--goodbg);color:var(--good);border-color:#bbf7d0}
textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:8px;margin-top:8px}
svg.chart-svg{width:100%;height:150px;overflow:visible}
</style>
</head>
<body>
<header>
  <div class="row">
    <div>
      <h1>Ross Fitness</h1>
      <p id="header-subtitle">16-Week Strength & Hypertrophy Tracker</p>
    </div>
    <div id="rest-timer-btn"></div>
  </div>
</header>

<main id="app"></main>

<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="workout">Workout</button>
  <button data-tab="program">16-Wk Plan</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="more">More</button>
</nav>

<script>
// Program Structure (Default Routine)
const P = {
  "Monday — Push": [
    ["Bench Press", 5, 5, "major"],
    ["Incline Bench Press", 4, 8, "major"],
    ["Standing Overhead Press", 4, 6, "major"],
    ["Close-Grip Bench Press", 3, 8, "hypertrophy"],
    ["Push-ups", 3, 0, "body"],
    ["Plank", 3, 60, "time"]
  ],
  "Tuesday — Pull": [
    ["Pull-up Progression", 5, 0, "pullup"],
    ["Barbell Row", 5, 8, "major"],
    ["Romanian Deadlift", 4, 8, "major"],
    ["Barbell Shrugs", 4, 12, "hypertrophy"],
    ["Barbell Curl", 4, 10, "hypertrophy"],
    ["Hanging Knee Raises", 3, 15, "body"]
  ],
  "Wednesday — Legs": [
    ["Back Squat", 5, 5, "major"],
    ["Bulgarian Split Squat", 3, 10, "hypertrophy"],
    ["Romanian Deadlift", 3, 10, "hypertrophy"],
    ["Standing Calf Raise", 5, 15, "hypertrophy"],
    ["Core", 3, 0, "body"]
  ],
  "Thursday — Upper": [
    ["Bench Press", 4, 8, "major"],
    ["Incline Bench Press", 4, 10, "major"],
    ["Pendlay Row", 4, 8, "major"],
    ["Overhead Press", 3, 10, "hypertrophy"],
    ["Barbell Pullover", 3, 12, "hypertrophy"],
    ["Barbell Curl", 3, 12, "hypertrophy"],
    ["Skull Crushers", 3, 12, "hypertrophy"]
  ],
  "Friday — Lower": [
    ["Deadlift", 5, 3, "major"],
    ["Front / High-Bar Squat", 4, 8, "major"],
    ["Walking Lunges", 3, 20, "body"],
    ["Romanian Deadlift", 3, 10, "hypertrophy"],
    ["Standing Calf Raise", 5, 15, "hypertrophy"]
  ],
  "Saturday — Full Body": [
    ["Bench Press", 3, 10, "major"],
    ["Pull-up Practice", 5, 0, "pullup"],
    ["Back Squat", 3, 8, "major"],
    ["Overhead Press", 3, 8, "major"],
    ["Barbell Row", 3, 10, "major"],
    ["Loaded Barbell Hold", 4, 45, "time"]
  ]
};

// 10-Pull-up progression program ladder (by current total target max)
const pullUpLadder = {
  0: "Assisted / Negative Pull-ups: 5 sets of 3-5 controlled negatives",
  1: "5 sets: 1, 1, 1, 1, 1 reps (Focus on form)",
  2: "5 sets: 2, 2, 1, 1, 1 reps",
  3: "5 sets: 3, 2, 2, 1, 1 reps",
  4: "5 sets: 3, 3, 2, 2, 1 reps",
  5: "5 sets: 4, 3, 3, 2, 2 reps",
  6: "5 sets: 4, 4, 3, 3, 2 reps",
  7: "5 sets: 5, 4, 4, 3, 2 reps",
  8: "5 sets: 5, 5, 4, 3, 3 reps",
  9: "5 sets: 6, 5, 4, 4, 3 reps",
  10: "Goal Achieved! Maintain with 5x5 weighted or bodyweight max testing."
};

let db = JSON.parse(localStorage.getItem('rossFitness') || JSON.stringify({
  logs: [],
  weightLogs: [{ date: new Date().toISOString().slice(0,10), weight: 240 }],
  weight: 240,
  targetWeight: 180,
  active: 0,
  currentWeekNum: 1,
  programStartDate: new Date().toISOString().slice(0,10)
}));

let tab = 'home';
let restTimer = null;
let restTimeLeft = 0;
let editingLogIndex = null;

const days = Object.keys(P);
const save = () => localStorage.setItem('rossFitness', JSON.stringify(db));

// Deload Logic: Weeks 4, 8, 12, 16 are automatic deload weeks (40% volume reduction, 20% weight reduction)
function isDeloadWeek(weekNum) {
  return weekNum % 4 === 0;
}

// Get last logged set for an exercise
function last(name) {
  return [...db.logs].reverse().find(x => x.exercise === name);
}

// Exercise-specific progression rule calculator
function getRecommendation(name, type, targetReps, targetSets) {
  let l = last(name);
  if (!l) return { text: 'Initial session', weight: 0 };
  
  if (type === 'body' || type === 'pullup') {
    let lastMax = Math.max(...l.sets.map(s => s.reps || 0), 0);
    return { text: `Last best set: ${lastMax} reps`, weight: 0 };
  }
  
  if (!l.weight) return { text: 'Set baseline weight', weight: 0 };

  let allSetsSuccessful = l.sets.length >= targetSets && l.sets.every(s => s.reps >= targetReps);
  
  // Custom increment rules
  let increment = 5;
  if (name.includes('Deadlift') || name.includes('Squat')) increment = 10;
  if (type === 'hypertrophy' || name.includes('Curl') || name.includes('Overhead')) increment = 2.5;

  let isDeload = isDeloadWeek(db.currentWeekNum || 1);
  let nextW = allSetsSuccessful ? l.weight + increment : l.weight;
  
  if (isDeload) {
    nextW = Math.round((nextW * 0.8) / 2.5) * 2.5; // 20% lighter for deload
    return { text: `Deload Week Target: ${nextW} lb`, weight: nextW };
  }

  return { text: allSetsSuccessful ? `Increase weight to ${nextW} lb` : `Maintain ${l.weight} lb and hit target reps`, weight: nextW };
}

// Estimated 1-Rep Max Calculation (Epley Formula)
function calc1RM(weight, reps) {
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

function getBest1RM(exerciseName) {
  let entries = db.logs.filter(x => x.exercise === exerciseName);
  let max1RM = 0;
  entries.forEach(e => {
    e.sets.forEach(s => {
      let e1rm = calc1RM(s.weight, s.reps);
      if (e1rm > max1RM) max1RM = e1rm;
    });
  });
  return max1RM;
}

// Rest Timer Functions
function startTimer(seconds) {
  clearInterval(restTimer);
  restTimeLeft = seconds;
  renderTimerUI();
  restTimer = setInterval(() => {
    restTimeLeft--;
    if (restTimeLeft <= 0) {
      clearInterval(restTimer);
      alert('Rest time is up! Get ready for your next set.');
    }
    renderTimerUI();
  }, 1000);
}

function renderTimerUI() {
  let container = document.getElementById('rest-timer-btn');
  if (!container) return;
  if (restTimeLeft > 0) {
    let m = Math.floor(restTimeLeft / 60);
    let s = String(restTimeLeft % 60).padStart(2, '0');
    container.innerHTML = `<button class="danger" onclick="clearInterval(restTimer);restTimeLeft=0;renderTimerUI();">⏱ ${m}:${s} (Stop)</button>`;
  } else {
    container.innerHTML = `<button class="secondary" style="font-size:11px;" onclick="startTimer(90)">⏱ 90s Rest</button>`;
  }
}

// Navigation & Tab Render
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTimerUI();
  ({ home, workout, program, progress, more }[tab])(document.getElementById('app'));
}

// TODAY'S WORKOUT Helper: automatically picks active day based on day of week or manual override
function getTodaysDayIndex() {
  let dayOfWeek = new Date().getDay(); // 0 is Sun, 1 is Mon...
  if (dayOfWeek >= 1 && dayOfWeek <= 6) return dayOfWeek - 1;
  return 0; // Default to Monday on Sunday
}

// --- HOME TAB ---
function home(a) {
  let currentWk = db.currentWeekNum || 1;
  let isDeload = isDeloadWeek(currentWk);
  let weekLogs = db.logs.filter(x => x.programWeek === currentWk);
  let doneCount = new Set(weekLogs.map(x => x.day)).size;
  
  let benchBest = getBest1RM('Bench Press');
  let pullupLogs = db.logs.filter(x => x.type === 'pullup').flatMap(x => x.sets.map(s => s.reps || 0));
  let pullupMax = pullupLogs.length ? Math.max(...pullupLogs) : 0;

  // 250lb Bench Progress Calculation
  let benchLog = last('Bench Press');
  let currentBench = benchLog ? benchLog.weight : 0;
  let benchPct = Math.min(100, Math.max(0, Math.round((currentBench / 250) * 100)));

  let todaysIndex = getTodaysDayIndex();

  a.innerHTML = `
    ${isDeload ? `<div class="card" style="background:var(--warnbg);border-color:var(--warn);color:var(--warn)"><b>⚡ Week ${currentWk} is an Automatic Deload Week</b><p class="small" style="margin:4px 0 0">Reduce workload, maintain form, and allow your body to recover.</p></div>` : ''}
    
    <div class="card">
      <div class="row">
        <h2>Week ${currentWk} Overview</h2>
        <span class="badge ${isDeload?'badge-deload':''}">${isDeload ? 'Deload Week' : 'Training Week'}</span>
      </div>
      <div class="grid">
        <div class="stat"><span class="muted">Completed Workouts</span><b>${doneCount} / 6</b></div>
        <div class="stat"><span class="muted">Bodyweight</span><b>${db.weight} lb</b></div>
        <div class="stat"><span class="muted">Bench Max Est.</span><b>${benchBest ? benchBest + ' lb' : '—'}</b></div>
        <div class="stat"><span class="muted">Pull-up PR</span><b>${pullupMax} reps</b></div>
      </div>
      <button class="primary" style="width:100%;margin-top:12px;padding:14px;font-size:16px;" onclick="db.active=${todaysIndex};save();tab='workout';render();">
        🏋️ Start Today's Workout (${days[todaysIndex].split(' — ')[1]})
      </button>
    </div>

    <div class="card">
      <h3>250 lb Bench Press Tracker</h3>
      <div class="goalrow"><span>Current Weight: <b>${currentBench} lb</b></span><span>Goal: <b>250 lb</b></span></div>
      <div class="bar"><i style="width:${benchPct}%"></i></div>
      <div class="small" style="text-align:right">${benchPct}% achieved</div>
    </div>

    <div class="card">
      <h2>Select Day</h2>
      <div class="list">
        ${days.map((d, i) => `
          <button onclick="db.active=${i};editingLogIndex=null;save();tab='workout';render()">
            <b>${d}</b> ${i === todaysIndex ? '<span class="badge">Today</span>' : ''}<br>
            <span class="muted">${P[d].length} exercises</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

// --- WORKOUT TAB ---
function workout(a) {
  let day = days[db.active];
  let ex = P[day];
  let isDeload = isDeloadWeek(db.currentWeekNum || 1);

  a.innerHTML = `
    <div class="card">
      <div class="row">
        <div>
          <h2>${day}</h2>
          <span class="muted">Week ${db.currentWeekNum || 1} ${isDeload ? '(Deload Active)' : ''}</span>
        </div>
        <button class="secondary" onclick="tab='home';render()">Back</button>
      </div>
    </div>

    <div class="card">
      ${ex.map((e, i) => exerciseHTML(e, i, isDeload)).join('')}
      
      <h3>Workout Notes</h3>
      <textarea id="workout-notes" rows="3" placeholder="How did today feel? Energy level, soreness, extra notes..."></textarea>
      
      <button class="primary" style="width:100%;margin-top:14px" onclick="saveWorkout()">Save Completed Workout</button>
    </div>
  `;
}

function exerciseHTML(e, i, isDeload) {
  let [n, s, t, type] = e;
  let effectiveSets = isDeload ? Math.max(2, Math.floor(s * 0.6)) : s;
  let rec = getRecommendation(n, type, t, effectiveSets);
  
  let rows = '';
  for (let j = 0; j < effectiveSets; j++) {
    let ph = type === 'time' ? t + ' sec' : (type === 'body' || type === 'pullup' ? 'reps done' : t + ' reps');
    rows += `
      <div class="setrow">
        <span>${j + 1}</span>
        <input id="w${i}-${j}" type="number" step="2.5" placeholder="${type === 'body' || type === 'pullup' ? '0 (BW)' : (rec.weight || 'weight')}" ${type === 'body' || type === 'pullup' ? '' : ''}>
        <input id="r${i}-${j}" type="number" placeholder="${ph}">
        <button class="secondary" onclick="document.getElementById('r${i}-${j}').value='${t || ''}';startTimer(90)">✓</button>
      </div>
    `;
  }

  return `
    <section class="exercise">
      <div class="exercise-title">
        <div>
          <h3>${n}</h3>
          <span class="muted">${effectiveSets} sets ${t ? ' × ' + t + (type === 'time' ? ' sec' : ' reps') : ''}</span>
        </div>
        <span class="badge ${isDeload?'badge-deload':''}">${type}</span>
      </div>
      ${rec.text ? `<div class="recommend">💡 ${rec.text}</div>` : ''}
      ${type === 'pullup' ? `<div class="small" style="margin-top:4px;color:#3730a3"><b>Ladder Suggestion:</b> ${pullUpLadder[Math.min(10, Math.max(...(db.logs.filter(x => x.type==='pullup').flatMap(x=>x.sets.map(s=>s.reps||0))),0))] || ''}</div>` : ''}
      <div>${rows}</div>
    </section>
  `;
}

function saveWorkout() {
  let day = days[db.active];
  let ex = P[day];
  let wk = db.currentWeekNum || 1;
  let notes = document.getElementById('workout-notes')?.value || '';
  let isDeload = isDeloadWeek(wk);

  ex.forEach((e, i) => {
    let [n, s, t, type] = e;
    let effectiveSets = isDeload ? Math.max(2, Math.floor(s * 0.6)) : s;
    let vals = [];
    for (let j = 0; j < effectiveSets; j++) {
      let w = document.getElementById(`w${i}-${j}`)?.value || 0;
      let r = document.getElementById(`r${i}-${j}`)?.value || 0;
      if (w || r) vals.push({ weight: +w, reps: +r });
    }
    if (vals.length) {
      db.logs.push({
        day,
        exercise: n,
        target: t,
        targetSets: effectiveSets,
        type,
        weight: vals.find(v => v.weight)?.weight || 0,
        sets: vals,
        programWeek: wk,
        notes: notes,
        date: new Date().toISOString()
      });
    }
  });

  save();
  alert('Workout logged successfully!');
  tab = 'home';
  render();
}

// --- 16-WEEK PROGRAM TAB ---
function program(a) {
  let current = db.currentWeekNum || 1;
  let gridHTML = '';
  
  for (let w = 1; w <= 16; w++) {
    let isDeload = isDeloadWeek(w);
    let isDone = db.logs.some(x => x.programWeek === w);
    let isActive = w === current;
    
    gridHTML += `
      <div class="cal-day ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}" onclick="db.currentWeekNum=${w};save();render()">
        <b>Wk ${w}</b><br>
        <span style="font-size:10px">${isDeload ? 'DELOAD' : 'Train'}</span>
      </div>
    `;
  }

  a.innerHTML = `
    <div class="card">
      <h2>16-Week Program Calendar</h2>
      <p class="muted">Select your active week. Weeks 4, 8, 12, and 16 automatically apply deload parameters.</p>
      <div class="calendar-grid">${gridHTML}</div>
    </div>

    <div class="card">
      <h3>10 Strict Pull-Up Progression Ladder</h3>
      <p class="small">Follow this targeted progression scheme on Pull days:</p>
      <ul style="padding-left:18px;" class="small">
        ${Object.entries(pullUpLadder).map(([reps, desc]) => `<li><b>${reps} Rep Max Baseline:</b> ${desc}</li>`).join('')}
      </ul>
    </div>
  `;
}

// --- PROGRESS TAB & SVG CHARTS ---
function progress(a) {
  let chestVolume = calculateChestVolume();
  let benchBest = getBest1RM('Bench Press');
  let squatBest = getBest1RM('Back Squat');
  let dead Best = getBest1RM('Deadlift');
  let rowBest = getBest1RM('Barbell Row');

  a.innerHTML = `
    <div class="card">
      <h2>Estimated 1-Rep Max Personal Records</h2>
      <div class="grid">
        <div class="stat"><span class="muted">Bench Press</span><b>${benchBest ? benchBest + ' lb' : '—'}</b></div>
        <div class="stat"><span class="muted">Back Squat</span><b>${squatBest ? squatBest + ' lb' : '—'}</b></div>
        <div class="stat"><span class="muted">Deadlift</span><b>${deadBest ? deadBest + ' lb' : '—'}</b></div>
        <div class="stat"><span class="muted">Barbell Row</span><b>${rowBest ? rowBest + ' lb' : '—'}</b></div>
      </div>
    </div>

    <div class="card">
      <h3>Chest Volume Tracking (This Week)</h3>
      <div class="stat"><b>${chestVolume.sets} total sets • ${chestVolume.volume} lb total volume</b></div>
    </div>

    <div class="card">
      <h3>Bench Press Progression Chart</h3>
      ${renderChart('Bench Press')}
    </div>

    <div class="card">
      <h3>Squat Progression Chart</h3>
      ${renderChart('Back Squat')}
    </div>

    <div class="card">
      <h3>Bodyweight Trend Chart</h3>
      ${renderBodyweightChart()}
      <div class="row" style="margin-top:12px">
        <input id="bw-input" type="number" step="0.1" value="${db.weight}" style="padding:10px;border:1px solid #d1d5db;border-radius:9px;width:130px">
        <button class="primary" onclick="logBodyweight()">Log Weight</button>
      </div>
    </div>

    <div class="card">
      <h2>Workout History & Editing</h2>
      <div id="history-list">${renderHistoryList()}</div>
    </div>
  `;
}

function calculateChestVolume() {
  let chestExercises = ['Bench Press', 'Incline Bench Press', 'Close-Grip Bench Press', 'Push-ups'];
  let currentWk = db.currentWeekNum || 1;
  let logs = db.logs.filter(x => x.programWeek === currentWk && chestExercises.includes(x.exercise));
  
  let totalSets = 0;
  let totalVol = 0;
  logs.forEach(l => {
    l.sets.forEach(s => {
      totalSets++;
      totalVol += (s.weight || 0) * (s.reps || 0);
    });
  });
  return { sets: totalSets, volume: totalVol };
}

function renderChart(exerciseName) {
  let logs = db.logs.filter(x => x.exercise === exerciseName && x.weight > 0);
  if (logs.length < 2) return `<p class="muted">Log at least 2 sessions of ${exerciseName} to view trend chart.</p>`;
  
  let points = logs.map(l => l.weight);
  let min = Math.min(...points) - 10;
  let max = Math.max(...points) + 10;
  let svgPts = points.map((val, idx) => {
    let x = (idx / (points.length - 1)) * 300;
    let y = 130 - ((val - min) / (max - min)) * 110;
    return `${x},${y}`;
  }).join(' ');

  return `
    <svg class="chart-svg" viewBox="0 0 300 140">
      <polyline fill="none" stroke="#111827" stroke-width="3" points="${svgPts}" />
      ${points.map((val, idx) => {
        let x = (idx / (points.length - 1)) * 300;
        let y = 130 - ((val - min) / (max - min)) * 110;
        return `<circle cx="${x}" cy="${y}" r="4" fill="#1d4ed8" /><text x="${x}" y="${y-8}" font-size="10" text-anchor="middle">${val}</text>`;
      }).join('')}
    </svg>
  `;
}

function renderBodyweightChart() {
  let logs = db.weightLogs || [];
  if (logs.length < 2) return `<p class="muted">Log bodyweight daily or weekly to render trend chart.</p>`;
  
  let points = logs.map(l => l.weight);
  let min = Math.min(...points) - 5;
  let max = Math.max(...points) + 5;
  let svgPts = points.map((val, idx) => {
    let x = (idx / (points.length - 1)) * 300;
    let y = 130 - ((val - min) / (max - min)) * 110;
    return `${x},${y}`;
  }).join(' ');

  return `
    <svg class="chart-svg" viewBox="0 0 300 140">
      <polyline fill="none" stroke="#166534" stroke-width="3" points="${svgPts}" />
      ${points.map((val, idx) => {
        let x = (idx / (points.length - 1)) * 300;
        let y = 130 - ((val - min) / (max - min)) * 110;
        return `<circle cx="${x}" cy="${y}" r="4" fill="#166534" /><text x="${x}" y="${y-8}" font-size="10" text-anchor="middle">${val}</text>`;
      }).join('')}
    </svg>
  `;
}

function logBodyweight() {
  let val = +document.getElementById('bw-input').value;
  if (!val) return;
  db.weight = val;
  if (!db.weightLogs) db.weightLogs = [];
  db.weightLogs.push({ date: new Date().toISOString().slice(0,10), weight: val });
  save();
  render();
}

function renderHistoryList() {
  if (!db.logs.length) return `<span class="muted">No logged workouts available.</span>`;
  return [...db.logs].reverse().slice(0, 10).map((l, idx) => {
    let actualIdx = db.logs.length - 1 - idx;
    return `
      <div class="stat" style="margin-bottom:8px">
        <div class="row">
          <b>${l.exercise} — Wk ${l.programWeek || 1}</b>
          <button class="secondary" style="padding:4px 8px;font-size:11px" onclick="deleteLog(${actualIdx})">Delete</button>
        </div>
        <span class="muted">${new Date(l.date).toLocaleDateString()} • ${l.sets.map(s => s.weight ? `${s.weight}lb×${s.reps}` : `${s.reps}reps`).join(', ')}</span>
        ${l.notes ? `<div class="small" style="margin-top:4px;font-style:italic">"${l.notes}"</div>` : ''}
      </div>
    `;
  }).join('');
}

function deleteLog(idx) {
  if (confirm('Delete this workout log entry?')) {
    db.logs.splice(idx, 1);
    save();
    render();
  }
}

// --- MORE / SETTINGS TAB ---
function more(a) {
  a.innerHTML = `
    <div class="card">
      <h2>Backup & Data Management</h2>
      <p class="muted">Export or restore your full workout logs and bodyweight history.</p>
      <button class="primary" onclick="exportData()">Export Backup (.json)</button>
      <button class="secondary" onclick="importData()">Import Backup (.json)</button>
    </div>

    <div class="card">
      <h3>Target Settings</h3>
      <div class="goalrow"><span>Target Bodyweight</span><b>${db.targetWeight} lb</b></div>
      <div class="goalrow"><span>Bench Goal</span><b>250 lb</b></div>
      <div class="goalrow"><span>Pull-Up Goal</span><b>10 Strict</b></div>
    </div>

    <div class="card">
      <h3>Reset Data</h3>
      <button class="danger" onclick="if(confirm('Reset all saved workout data?')){localStorage.removeItem('rossFitness');location.reload()}">Delete All Local History</button>
    </div>
  `;
}

function exportData() {
  let a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = `ross-fitness-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData() {
  let i = document.createElement('input');
  i.type = 'file';
  i.accept = '.json';
  i.onchange = () => {
    let r = new FileReader();
    r.onload = () => {
      try {
        db = JSON.parse(r.result);
        save();
        render();
        alert('Data successfully imported!');
      } catch (e) {
        alert('Invalid JSON backup file.');
      }
    };
    r.readAsText(i.files[0]);
  };
  i.click();
}

// Global Event Listeners & SW Setup
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  render();
});

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
